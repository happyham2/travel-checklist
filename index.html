<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해외여행 준비물 체크리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Checkbox animation */
        .checkbox-container input:checked + div {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        
        .checkbox-container input:checked + div svg {
            display: block;
        }

        /* Strikethrough animation for checked items */
        .item-text {
            transition: all 0.2s ease;
        }
        .checked-item .item-text {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="min-h-screen pb-20 sm:pb-10">

    <header class="sticky top-0 bg-white/80 backdrop-blur-md shadow-sm z-10 px-4 py-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-plane-departure text-blue-500"></i>
                여행 준비물 체크리스트
            </h1>
            
            <!-- Progress Bar -->
            <div class="mt-4">
                <div class="flex justify-between text-sm font-medium text-gray-600 mb-1">
                    <span>준비 진행률</span>
                    <span id="progressText">0% (0/0)</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
        
        <!-- Add New Item Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-100 flex gap-2">
            <select id="categorySelect" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                <option value="essential">필수 서류/돈</option>
                <option value="electronics">전자기기</option>
                <option value="toiletries">세면도구/화장품</option>
                <option value="clothes">의류/신발</option>
                <option value="medicine">비상약</option>
                <option value="others">기타 유용템</option>
            </select>
            <input type="text" id="newItemInput" placeholder="새로운 준비물 추가..." class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 outline-none" onkeypress="handleKeyPress(event)">
            <button onclick="addNewItem()" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 outline-none transition-colors whitespace-nowrap">
                추가
            </button>
        </div>

        <!-- Checklist Container -->
        <div id="checklistContainer" class="space-y-6">
            <!-- Categories will be rendered here by JS -->
        </div>

    </main>

    <div class="fixed bottom-6 right-6 z-20">
        <button onclick="confirmReset()" class="bg-red-500 hover:bg-red-600 text-white rounded-full p-4 shadow-lg transition-transform hover:scale-105 group relative flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-red-300">
            <i class="fa-solid fa-rotate-right text-lg"></i>
            <span class="absolute right-full mr-3 bg-gray-800 text-white text-xs px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                초기화
            </span>
        </button>
    </div>

    <script>
        // Default checklist data based on research
        const defaultData = {
            essential: {
                title: "🛂 필수 서류 및 자금",
                items: [
                    { id: 'e1', text: "여권 (유효기간 6개월 이상 확인)", checked: false },
                    { id: 'e2', text: "항공권 E-티켓 사본", checked: false },
                    { id: 'e3', text: "숙소 바우처 사본", checked: false },
                    { id: 'e4', text: "여행자 보험 영문 증명서", checked: false },
                    { id: 'e5', text: "해외 결제용 카드 (트래블월렛/로그 등)", checked: false },
                    { id: 'e6', text: "현지 통화 (현금 소량)", checked: false },
                    { id: 'e7', text: "국제운전면허증 (렌터카 이용시)", checked: false }
                ]
            },
            electronics: {
                title: "📱 전자기기",
                items: [
                    { id: 'el1', text: "스마트폰 및 충전기", checked: false },
                    { id: 'el2', text: "보조배터리 (반드시 기내 수하물)", checked: false },
                    { id: 'el3', text: "멀티 어댑터 (돼지코)", checked: false },
                    { id: 'el4', text: "유심 / eSIM / 포켓와이파이", checked: false },
                    { id: 'el5', text: "멀티탭 (콘센트 부족 대비)", checked: false },
                    { id: 'el6', text: "이어폰 (노이즈 캔슬링 추천)", checked: false }
                ]
            },
            toiletries: {
                title: "🧴 세면도구 및 화장품",
                items: [
                    { id: 't1', text: "칫솔, 치약 (기내용 포함)", checked: false },
                    { id: 't2', text: "스킨케어 (소분 추천)", checked: false },
                    { id: 't3', text: "선크림", checked: false },
                    { id: 't4', text: "클렌징 용품", checked: false },
                    { id: 't5', text: "샤워기 필터 (수질 예민시)", checked: false },
                    { id: 't6', text: "면도기 / 제모기", checked: false }
                ]
            },
            clothes: {
                title: "👕 의류 및 신발",
                items: [
                    { id: 'c1', text: "일정별 겉옷 및 이너웨어", checked: false },
                    { id: 'c2', text: "속옷 및 양말 (여유있게)", checked: false },
                    { id: 'c3', text: "잠옷", checked: false },
                    { id: 'c4', text: "편한 운동화", checked: false },
                    { id: 'c5', text: "실내용 또는 간편한 슬리퍼", checked: false },
                    { id: 'c6', text: "가디건 등 긴팔 (기내/에어컨 대비)", checked: false }
                ]
            },
            medicine: {
                title: "💊 비상약 및 위생",
                items: [
                    { id: 'm1', text: "종합 감기약 / 해열제", checked: false },
                    { id: 'm2', text: "소화제 / 지사제", checked: false },
                    { id: 'm3', text: "진통제 (두통, 생리통 등)", checked: false },
                    { id: 'm4', text: "반창고 / 연고", checked: false },
                    { id: 'm5', text: "물티슈 / 소독용 티슈", checked: false }
                ]
            },
            others: {
                title: "✨ 기타 유용템",
                items: [
                    { id: 'o1', text: "목베개 (장거리 비행시)", checked: false },
                    { id: 'o2', text: "접이식 우산 / 양산", checked: false },
                    { id: 'o3', text: "지퍼백 / 비닐봉투 (젖은 옷 보관)", checked: false },
                    { id: 'o4', text: "볼펜 (출입국 신고서 작성용)", checked: false },
                    { id: 'o5', text: "휴대용 가방 (크로스백 등)", checked: false }
                ]
            }
        };

        // State management
        let checklistData = {};

        
        // Initialize App
        function init() {
            loadData();
            renderChecklist();
            updateProgress();
        }

        // Load data from LocalStorage or use default
        function loadData() {
            const savedData = localStorage.getItem('travelChecklistData');
            if (savedData) {
                checklistData = JSON.parse(savedData);
                // Ensure all default categories exist in loaded data (in case of updates)
                for (const cat in defaultData) {
                    if (!checklistData[cat]) {
                        checklistData[cat] = defaultData[cat];
                    }
                }
            } else {
                // Deep copy default data
                checklistData = JSON.parse(JSON.stringify(defaultData));
            }
        }

        // Save data to LocalStorage
        function saveData() {
            localStorage.setItem('travelChecklistData', JSON.stringify(checklistData));
            updateProgress();
        }

        // Render the UI
        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';

            for (const [categoryKey, categoryData] of Object.entries(checklistData)) {
                // Skip rendering if category is empty
                if (categoryData.items.length === 0) continue;

                const section = document.createElement('section');
                section.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6';
                
                // Category Header
                const header = document.createElement('div');
                header.className = 'bg-gray-50 px-4 py-3 border-b border-gray-100 flex justify-between items-center';
                header.innerHTML = `<h2 class="text-lg font-semibold text-gray-800">${categoryData.title}</h2>`;
                section.appendChild(header);

                // Items List
                const ul = document.createElement('ul');
                ul.className = 'divide-y divide-gray-50';

                categoryData.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = `p-4 flex items-center justify-between hover:bg-gray-50 transition-colors ${item.checked ? 'checked-item' : ''}`;
                    
                    li.innerHTML = `
                        <label class="flex items-center cursor-pointer flex-1 checkbox-container group">
                            <input type="checkbox" class="peer sr-only" ${item.checked ? 'checked' : ''} onchange="toggleItem('${categoryKey}', '${item.id}')">
                            <div class="w-6 h-6 rounded border-2 border-gray-300 mr-3 flex items-center justify-center bg-white transition-colors group-hover:border-blue-400 peer-focus:ring-2 peer-focus:ring-blue-200">
                                <svg class="w-4 h-4 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <span class="item-text text-gray-700 select-none">${item.text}</span>
                        </label>
                        <button onclick="deleteItem('${categoryKey}', '${item.id}')" class="text-gray-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-colors focus:outline-none" aria-label="삭제">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    `;
                    ul.appendChild(li);
                });

                section.appendChild(ul);
                container.appendChild(section);
            }
        }


        // Toggle item checked state
        function toggleItem(categoryKey, itemId) {
            const item = checklistData[categoryKey].items.find(i => i.id === itemId);
            if (item) {
                item.checked = !item.checked;
                saveData();
                renderChecklist(); // Re-render to update styles
            }
        }

        // Add a new item
        function addNewItem() {
            const input = document.getElementById('newItemInput');
            const categoryKey = document.getElementById('categorySelect').value;
            const text = input.value.trim();

            if (text === '') return;

            const newItem = {
                id: 'custom_' + Date.now(),
                text: text,
                checked: false
            };

            checklistData[categoryKey].items.push(newItem);
            input.value = '';
            
            saveData();
            renderChecklist();
        }

        // Handle Enter key for input
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                addNewItem();
            }
        }

        // Delete an item
        function deleteItem(categoryKey, itemId) {
            // Optional: Add simple confirmation for delete
            // if(!confirm('삭제하시겠습니까?')) return; 
            
            checklistData[categoryKey].items = checklistData[categoryKey].items.filter(i => i.id !== itemId);
            saveData();
            renderChecklist();
        }

        // Update progress bar
        function updateProgress() {
            let totalItems = 0;
            let checkedItems = 0;

            for (const key in checklistData) {
                checklistData[key].items.forEach(item => {
                    totalItems++;
                    if (item.checked) checkedItems++;
                });
            }

            const percentage = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
            
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('progressText').innerText = `${percentage}% (${checkedItems}/${totalItems})`;
            
            // Change color based on completion
            const bar = document.getElementById('progressBar');
            if(percentage === 100) {
                bar.classList.remove('bg-blue-500');
                bar.classList.add('bg-green-500');
            } else {
                bar.classList.remove('bg-green-500');
                bar.classList.add('bg-blue-500');
            }
        }

        // Reset data to defaults
        function confirmReset() {
            // Using a simple custom modal instead of alert/confirm as per instructions
            createModal(
                '초기화 확인', 
                '체크리스트를 처음 상태로 되돌리시겠습니까?<br>추가하신 항목과 체크 기록이 모두 삭제됩니다.',
                () => {
                    checklistData = JSON.parse(JSON.stringify(defaultData));
                    saveData();
                    renderChecklist();
                }
            );
        }

        
        // Helper function to create a beautiful confirm modal
        function createModal(title, message, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300';
            
            const modal = document.createElement('div');
            modal.className = 'bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300';
            
            modal.innerHTML = `
                <h3 class="text-lg font-bold text-gray-900 mb-2">${title}</h3>
                <p class="text-sm text-gray-500 mb-6">${message}</p>
                <div class="flex justify-end gap-3">
                    <button id="modalCancelBtn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">취소</button>
                    <button id="modalConfirmBtn" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">확인</button>
                </div>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            // Animate in
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-95');
            });

            const close = () => {
                overlay.classList.add('opacity-0');
                modal.classList.add('scale-95');
                setTimeout(() => overlay.remove(), 300);
            };

            document.getElementById('modalCancelBtn').onclick = close;
            document.getElementById('modalConfirmBtn').onclick = () => {
                onConfirm();
                close();
            };
            
            // Close on background click
            overlay.onclick = (e) => {
                if(e.target === overlay) close();
            };
        }

        // Run init on load
        window.onload = init;
    </script>
</body>
</html>
