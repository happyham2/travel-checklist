<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 최적화를 위한 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가족 해외여행 체크리스트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
        }

        .checkbox-container input:checked + div {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .checkbox-container input:checked + div svg { display: block; }

        .item-text { transition: all 0.2s ease; }
        .checked-item .item-text { text-decoration: line-through; color: #94a3b8; }

        .tab-active { color: #2563eb; font-weight: 700; }
        .tab-active .icon-bg { background-color: #dbeafe; transform: scale(1.05); }
        .tab-inactive { color: #94a3b8; font-weight: 500; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="min-h-screen">

    <header class="sticky top-0 bg-white/95 backdrop-blur-md shadow-sm z-40 px-4 py-3 sm:px-6 transition-all duration-300">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <h1 id="headerTitle" class="text-[1.15rem] font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-plane-departure text-blue-500"></i>
                가족 공통 준비물
            </h1>
            
            <button onclick="confirmReset()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-2.5 rounded-full transition-colors active:scale-95" aria-label="초기화">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
        
        <!-- 진행률 바 -->
        <div class="max-w-2xl mx-auto mt-3">
            <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1.5 px-0.5">
                <span>진행률</span>
                <span id="progressText" class="text-blue-600">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2">
                <div id="progressBar" class="bg-blue-500 h-2 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-5 sm:px-6">
        
        <!-- 입력 폼 -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm mb-6 border border-slate-100 flex gap-2 items-center">
            <select id="categorySelect" class="bg-slate-50 border-none text-slate-700 text-[13px] rounded-xl focus:ring-2 focus:ring-blue-100 block py-3 pl-3 pr-8 outline-none font-medium appearance-none">
            </select>
            <input type="text" id="newItemInput" placeholder="물건 추가..." class="bg-slate-50 border-none text-slate-800 text-[15px] rounded-xl focus:ring-2 focus:ring-blue-100 block w-full p-3 outline-none" onkeypress="handleKeyPress(event)">
            <button onclick="addNewItem()" class="text-white bg-blue-600 active:bg-blue-700 font-semibold rounded-xl text-[14px] px-4 py-3 outline-none transition-transform active:scale-95 whitespace-nowrap shadow-sm">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- 체크리스트 목록 영역 -->
        <div id="checklistContainer" class="space-y-4">
        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 pb-safe z-40 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
        <div class="max-w-2xl mx-auto flex justify-between items-center px-1 sm:px-4 py-1.5">
            <button onclick="changeTab('common')" id="tab-common" class="flex flex-col items-center flex-1 py-1.5 tab-active transition-all duration-200">
                <div class="icon-bg w-10 h-10 rounded-full flex items-center justify-center mb-0.5 transition-all duration-300">
                    <i class="fa-solid fa-suitcase-rolling text-[1.1rem]"></i>
                </div>
                <span class="text-[10px] tracking-tight">공통</span>
            </button>
            <button onclick="changeTab('dad')" id="tab-dad" class="flex flex-col items-center flex-1 py-1.5 tab-inactive transition-all duration-200">
                <div class="icon-bg w-10 h-10 rounded-full flex items-center justify-center mb-0.5 transition-all duration-300">
                    <i class="fa-solid fa-user-tie text-[1.1rem]"></i>
                </div>
                <span class="text-[10px] tracking-tight">아빠</span>
            </button>
            <button onclick="changeTab('mom')" id="tab-mom" class="flex flex-col items-center flex-1 py-1.5 tab-inactive transition-all duration-200">
                <div class="icon-bg w-10 h-10 rounded-full flex items-center justify-center mb-0.5 transition-all duration-300">
                    <i class="fa-solid fa-user-nurse text-[1.1rem]"></i>
                </div>
                <span class="text-[10px] tracking-tight">엄마</span>
            </button>
            <button onclick="changeTab('daughter')" id="tab-daughter" class="flex flex-col items-center flex-1 py-1.5 tab-inactive transition-all duration-200">
                <div class="icon-bg w-10 h-10 rounded-full flex items-center justify-center mb-0.5 transition-all duration-300">
                    <i class="fa-solid fa-child-dress text-[1.1rem]"></i>
                </div>
                <span class="text-[10px] tracking-tight">딸</span>
            </button>
            <button onclick="changeTab('son')" id="tab-son" class="flex flex-col items-center flex-1 py-1.5 tab-inactive transition-all duration-200">
                <div class="icon-bg w-10 h-10 rounded-full flex items-center justify-center mb-0.5 transition-all duration-300">
                    <i class="fa-solid fa-child text-[1.1rem]"></i>
                </div>
                <span class="text-[10px] tracking-tight">아들</span>
            </button>
        </div>
    </nav>

    <script>
        // 공통 데이터 정의
        const commonDefaultData = {
            essential: { title: "🛂 필수 서류 및 자금", items: [
                { id: 'e1', text: "여권 (유효기간 확인)", type: 'checkbox', checked: false },
                { id: 'e2', text: "항공권 E-티켓 사본", type: 'checkbox', checked: false },
                { id: 'e3', text: "여행자보험 가입 및 사본", type: 'checkbox', checked: false },
                { id: 'e5', text: "트래블월렛/해외결제카드", type: 'checkbox', checked: false },
                { id: 'e6', text: "현지 통화 (현금 소량)", type: 'checkbox', checked: false }
            ]},
            electronics: { title: "📱 전자기기", items: [
                { id: 'el1', text: "멀티 어댑터 (돼지코)", type: 'checkbox', checked: false },
                { id: 'el2', text: "유심 / eSIM / 로밍", type: 'checkbox', checked: false },
                { id: 'el3', text: "멀티탭", type: 'checkbox', checked: false },
                { id: 'el4', text: "충전케이블", type: 'checkbox', checked: false },
                { id: 'el5', text: "카메라", type: 'checkbox', checked: false },
                { id: 'el6', text: "셀카봉", type: 'checkbox', checked: false },
                { id: 'el7', text: "가방무게저울", type: 'checkbox', checked: false },
                { id: 'el8', text: "다리미 (휴대용)", type: 'checkbox', checked: false }
            ]},
            toiletries: { title: "🧴 세면도구 및 화장품", items: [
                { id: 't1', text: "칫솔, 치약", type: 'checkbox', checked: false },
                { id: 't2', text: "스킨케어 용품", type: 'checkbox', checked: false },
                { id: 't3', text: "선크림", type: 'checkbox', checked: false },
                { id: 't4', text: "린스", type: 'checkbox', checked: false },
                { id: 't5', text: "세탁세제", type: 'checkbox', checked: false },
                { id: 't6', text: "샤워기필터", type: 'checkbox', checked: false },
                { id: 't7', text: "면봉", type: 'checkbox', checked: false },
                { id: 't8', text: "빗", type: 'checkbox', checked: false }
            ]},
            medicine: { title: "💊 비상약 및 위생", items: [
                { id: 'm1', text: "종합 감기약 / 해열제", type: 'checkbox', checked: false },
                { id: 'm2', text: "소화제 / 지사제", type: 'checkbox', checked: false },
                { id: 'm4', text: "반창고 / 연고", type: 'checkbox', checked: false },
                { id: 'm5', text: "물티슈", type: 'checkbox', checked: false },
                { id: 'm6', text: "지퍼백", type: 'checkbox', checked: false }
            ]}
        };

        const personalDefaultTemplate = {
            clothes: {
                title: "👕 의류 (수량 체크)",
                items: [
                    { id: 'c1', text: "외출복 상의", type: 'counter', count: 0, checked: false },
                    { id: 'c2', text: "외출복 하의", type: 'counter', count: 0, checked: false },
                    { id: 'c3', text: "잠옷", type: 'counter', count: 0, checked: false },
                    { id: 'c4', text: "속옷", type: 'counter', count: 0, checked: false },
                    { id: 'c5', text: "양말", type: 'counter', count: 0, checked: false }
                ]
            },
            personal: {
                title: "🎒 개인 소지품",
                items: [
                    { id: 'p1', text: "보조배터리", type: 'checkbox', checked: false },
                    { id: 'p2', text: "버즈 이어폰", type: 'checkbox', checked: false },
                    { id: 'p3', text: "모자", type: 'checkbox', checked: false },
                    { id: 'p4', text: "노트북", type: 'checkbox', checked: false },
                    { id: 'p5', text: "슬리퍼", type: 'checkbox', checked: false },
                    { id: 'p6', text: "우산", type: 'checkbox', checked: false }
                ]
            }
        };

        const dadData = JSON.parse(JSON.stringify(personalDefaultTemplate));
        dadData.personal.items.push({ id: 'dad_p1', text: "면도기", type: 'checkbox', checked: false });
        
        const sonData = JSON.parse(JSON.stringify(personalDefaultTemplate));

        const momData = JSON.parse(JSON.stringify(personalDefaultTemplate));
        momData.personal.items.push(
            { id: 'm_p1', text: "여성용품", type: 'checkbox', checked: false },
            { id: 'm_p2', text: "화장품", type: 'checkbox', checked: false },
            { id: 'm_p3', text: "클렌징용품", type: 'checkbox', checked: false },
            { id: 'm_p4', text: "다이슨", type: 'checkbox', checked: false },
            { id: 'm_p5', text: "머리끈", type: 'checkbox', checked: false }
        );

        const daughterData = JSON.parse(JSON.stringify(personalDefaultTemplate));
        daughterData.personal.items.push(
            { id: 'd_p1', text: "여성용품", type: 'checkbox', checked: false },
            { id: 'd_p2', text: "화장품", type: 'checkbox', checked: false },
            { id: 'd_p3', text: "클렌징용품", type: 'checkbox', checked: false },
            { id: 'd_p4', text: "교정기", type: 'checkbox', checked: false },
            { id: 'd_p5', text: "머리끈", type: 'checkbox', checked: false }
        );

        const defaultAppData = {
            common: commonDefaultData,
            dad: dadData,
            mom: momData,
            daughter: daughterData,
            son: sonData
        };

        let appData = {};
        let currentTab = 'common';

        const tabNames = {
            common: "가족 공통 준비물",
            dad: "아빠 님의 짐",
            mom: "엄마 님의 짐",
            daughter: "딸 님의 짐",
            son: "아들 님의 짐"
        };

        function init() {
            loadData();
            updateAddForm();
            renderChecklist();
            updateProgress();
        }

        function loadData() {
            const savedData = localStorage.getItem('travelApp_v5_mobile');
            if (savedData) {
                try {
                    appData = JSON.parse(savedData);
                    for (const key in defaultAppData) {
                        if (!appData[key]) {
                            appData[key] = JSON.parse(JSON.stringify(defaultAppData[key]));
                        } else {
                            for (const category in defaultAppData[key]) {
                                if (!appData[key][category]) {
                                    appData[key][category] = JSON.parse(JSON.stringify(defaultAppData[key][category]));
                                } else if (!appData[key][category].items) {
                                    appData[key][category].items = [];
                                }
                            }
                        }
                    }
                } catch (e) {
                    appData = JSON.parse(JSON.stringify(defaultAppData));
                }
            } else {
                appData = JSON.parse(JSON.stringify(defaultAppData));
            }
        }

        function saveData() {
            localStorage.setItem('travelApp_v5_mobile', JSON.stringify(appData));
            updateProgress();
        }

        function changeTab(tabId) {
            currentTab = tabId;
            
            document.getElementById('headerTitle').innerHTML = `
                ${tabId === 'common' ? '<i class="fa-solid fa-plane-departure text-blue-500"></i>' : '<i class="fa-solid fa-suitcase text-blue-500"></i>'}
                ${tabNames[tabId]}
            `;

            Object.keys(tabNames).forEach(id => {
                const btn = document.getElementById(`tab-${id}`);
                if (id === tabId) {
                    btn.classList.remove('tab-inactive');
                    btn.classList.add('tab-active');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('tab-inactive');
                }
            });

            updateAddForm();
            renderChecklist();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateAddForm() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '';
            
            if (currentTab === 'common') {
                select.innerHTML = `
                    <option value="essential">필수/자금</option>
                    <option value="electronics">전자기기</option>
                    <option value="toiletries">세면용품</option>
                    <option value="medicine">비상약</option>
                `;
            } else {
                select.innerHTML = `
                    <option value="clothes">의류 (수량)</option>
                    <option value="personal">소지품</option>
                `;
            }
        }

        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';
            
            const currentData = appData[currentTab];

            for (const [categoryKey, categoryData] of Object.entries(currentData)) {
                if (categoryData.items.length === 0) continue;

                const section = document.createElement('section');
                section.className = 'bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden';
                
                const header = document.createElement('div');
                header.className = 'bg-slate-50/80 px-4 py-3 border-b border-slate-100 flex justify-between items-center';
                header.innerHTML = `<h2 class="text-[14px] font-bold text-slate-800">${categoryData.title}</h2>`;
                section.appendChild(header);

                const ul = document.createElement('ul');
                ul.className = 'divide-y divide-slate-50';

                categoryData.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = `p-3.5 sm:p-4 flex items-center justify-between transition-colors ${item.checked ? 'checked-item bg-slate-50/50' : 'active:bg-slate-50'}`;
                    
                    li.innerHTML = `
                        <label class="flex items-center cursor-pointer flex-1 checkbox-container group overflow-hidden py-1">
                            <input type="checkbox" class="peer sr-only" ${item.checked ? 'checked' : ''} onchange="toggleItem('${categoryKey}', '${item.id}')">
                            <div class="w-6 h-6 rounded-full border-2 border-slate-300 mr-3 flex-shrink-0 flex items-center justify-center bg-white transition-all peer-active:scale-95">
                                <svg class="w-3.5 h-3.5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                                </svg>
                            </div>
                            <span class="item-text text-slate-700 text-[15px] sm:text-base select-none flex-1 pr-2 truncate font-medium">${item.text}</span>
                        </label>
                        
                        ${item.type === 'counter' ? `
                        <div class="flex items-center gap-1 mx-1 shrink-0 bg-slate-50 rounded-full p-1 border border-slate-100">
                            <button onclick="updateCount('${categoryKey}', '${item.id}', -1)" class="w-7 h-7 rounded-full bg-white text-slate-600 shadow-sm flex items-center justify-center active:bg-slate-200 transition-colors text-lg font-bold pb-0.5">-</button>
                            <span class="w-6 text-center font-bold text-slate-800 text-[14px]">${item.count}</span>
                            <button onclick="updateCount('${categoryKey}', '${item.id}', 1)" class="w-7 h-7 rounded-full bg-blue-100 text-blue-600 shadow-sm flex items-center justify-center active:bg-blue-200 transition-colors text-lg font-bold pb-0.5">+</button>
                        </div>
                        ` : ''}

                        <button onclick="deleteItem('${categoryKey}', '${item.id}')" class="text-slate-300 active:text-red-500 p-2 ml-1 rounded-full active:bg-red-50 transition-colors focus:outline-none shrink-0 text-lg">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                    ul.appendChild(li);
                });

                section.appendChild(ul);
                container.appendChild(section);
            }
        }

        function toggleItem(categoryKey, itemId) {
            const item = appData[currentTab][categoryKey].items.find(i => i.id === itemId);
            if (item) {
                item.checked = !item.checked;
                saveData();
                renderChecklist(); 
            }
        }

        function updateCount(categoryKey, itemId, change) {
            const item = appData[currentTab][categoryKey].items.find(i => i.id === itemId);
            if (item) {
                item.count = Math.max(0, item.count + change);
                item.checked = item.count > 0;
                saveData();
                renderChecklist();
            }
        }

        function addNewItem() {
            const input = document.getElementById('newItemInput');
            const categoryKey = document.getElementById('categorySelect').value;
            const text = input.value.trim();

            if (text === '') return;

            const isCounter = categoryKey === 'clothes'; 
            
            const newItem = {
                id: 'custom_' + Date.now(),
                text: text,
                type: isCounter ? 'counter' : 'checkbox',
                checked: false,
                ...(isCounter ? { count: 0 } : {})
            };

            appData[currentTab][categoryKey].items.push(newItem);
            input.value = '';
            input.blur();
            
            saveData();
            renderChecklist();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') addNewItem();
        }

        function deleteItem(categoryKey, itemId) {
            appData[currentTab][categoryKey].items = appData[currentTab][categoryKey].items.filter(i => i.id !== itemId);
            saveData();
            renderChecklist();
        }

        function updateProgress() {
            let totalItems = 0;
            let checkedItems = 0;
            
            if (appData[currentTab]) {
                for (const key in appData[currentTab]) {
                    if (appData[currentTab][key] && appData[currentTab][key].items) {
                        appData[currentTab][key].items.forEach(item => {
                            totalItems++;
                            if (item.checked) checkedItems++;
                        });
                    }
                }
            }

            const percentage = totalItems === 0 ? 0 : Math.round((checkedItems / totalItems) * 100);
            
            const bar = document.getElementById('progressBar');
            bar.style.width = `${percentage}%`;
            
            const progressText = document.getElementById('progressText');
            
            if (totalItems === 0) {
                progressText.innerText = '0%';
                progressText.className = 'text-slate-400';
            } else {
                progressText.innerText = `${percentage}% (${checkedItems}/${totalItems})`;
                if(percentage === 100) {
                    progressText.className = 'text-green-600 font-bold';
                    bar.classList.replace('bg-blue-500', 'bg-green-500');
                } else {
                    progressText.className = 'text-blue-600';
                    bar.classList.replace('bg-green-500', 'bg-blue-500');
                }
            }
        }

        function confirmReset() {
            createModal(
                '탭 초기화', 
                `<b>${tabNames[currentTab]}</b> 목록을 처음 상태로 되돌립니다.<br>추가하신 항목은 삭제됩니다.`,
                () => {
                    appData[currentTab] = JSON.parse(JSON.stringify(defaultAppData[currentTab]));
                    saveData();
                    renderChecklist();
                }
            );
        }

        function createModal(title, message, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-5 opacity-0 transition-opacity duration-200';
            
            const modal = document.createElement('div');
            modal.className = 'bg-white rounded-3xl shadow-xl w-full max-w-[320px] p-6 transform scale-95 transition-transform duration-200';
            
            modal.innerHTML = `
                <h3 class="text-lg font-bold text-slate-800 mb-2 text-center">${title}</h3>
                <p class="text-[14px] text-slate-500 mb-6 leading-relaxed text-center">${message}</p>
                <div class="flex gap-3">
                    <button id="modalCancelBtn" class="flex-1 py-3 text-[15px] font-bold text-slate-600 bg-slate-100 active:bg-slate-200 rounded-xl transition-colors">취소</button>
                    <button id="modalConfirmBtn" class="flex-1 py-3 text-[15px] font-bold text-white bg-blue-600 active:bg-blue-700 rounded-xl transition-colors shadow-sm">초기화</button>
                </div>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-95');
            });

            const close = () => {
                overlay.classList.add('opacity-0');
                modal.classList.add('scale-95');
                setTimeout(() => overlay.remove(), 200);
            };

            document.getElementById('modalCancelBtn').onclick = close;
            document.getElementById('modalConfirmBtn').onclick = () => {
                onConfirm();
                close();
            };
            overlay.onclick = (e) => { if(e.target === overlay) close(); };
        }

        window.onload = init;
    </script>
</body>
</html>
